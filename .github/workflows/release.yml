name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: swift test

      - name: Package app (universal binary + zip + dmg)
        run: ./scripts/package-app.sh "${{ steps.meta.outputs.version }}"

      # 手动触发时仅构建产物，不发布
      - name: Upload build artifacts (manual runs)
        if: steps.meta.outputs.is_tag != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PeggyTools-${{ steps.meta.outputs.version }}
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Create GitHub Release
        if: steps.meta.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Peggy Tools ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            ## 安装说明

            1. 下载 `PeggyTools-<version>.dmg`（或 zip），打开后将 **Peggy Tools** 拖入「应用程序」
            2. 首次打开若被 Gatekeeper 拦截（应用为 ad-hoc 签名）：右键点击应用 →「打开」→ 再点「打开」
            3. 系统要求 macOS 13+；全局快捷键与部分功能需要在设置中授予辅助功能权限

            > 本版本由 tag ${{ github.ref_name }} 自动构建（arm64 + x86_64 通用二进制）
          files: |
            dist/*.zip
            dist/*.dmg
